<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- OG 分享卡模板（v8.2）。由 .tools/gen-og.py 填充文字并截图。
     拉丁展示字用站点自托管字体；CJK 走系统栈（与站点正文一致）。
     静态纸白卡：分享预览是一次性对外形象，不随访问者主题变化。 -->
<style>
@font-face{font-family:"Chakra Petch";src:url("../static/fonts/chakrapetch-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Chakra Petch";src:url("../static/fonts/chakrapetch-500.woff2") format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("../static/fonts/jetbrainsmono-var.woff2") format("woff2") tech(variations);font-weight:400 800;font-display:block}
html,body{margin:0;background:#fff}
.og-card{width:1200px;height:630px;background:#f4f3ee;position:relative;overflow:hidden;box-sizing:border-box;
  padding:60px 72px;display:flex;flex-direction:column;
  font-family:"Chakra Petch","Microsoft YaHei","PingFang SC",sans-serif}
.og-card+.og-card{margin-top:24px}
.og-top{position:absolute;top:0;left:0;right:0;height:8px;background:#a5824a}
.og-kicker{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;color:#7a5c1a;letter-spacing:.18em}
.og-title{font-weight:700;font-size:66px;line-height:1.15;color:#14171b;margin-top:42px;max-width:1040px}
.og-desc{font-weight:500;font-size:28px;line-height:1.5;color:#4c545c;margin-top:24px;max-width:920px}
.og-foot{position:absolute;left:72px;right:72px;bottom:54px;border-top:1px solid #cdd1d8;
  padding-top:20px;display:flex;justify-content:space-between;
  font-family:"JetBrains Mono",monospace;font-size:20px;color:#4c545c;letter-spacing:.06em}
</style>
</head>
<body>

<div class="og-card" id="og-home">
  <div class="og-top"></div>
  <div class="og-kicker"></div>
  <div class="og-title"></div>
  <div class="og-desc"></div>
  <div class="og-foot"><span>adxs-hm.github.io/JHDblog</span><span class="f-meta"></span></div>
</div>

<div class="og-card" id="og-jhd-site">
  <div class="og-top"></div>
  <div class="og-kicker"></div>
  <div class="og-title"></div>
  <div class="og-desc"></div>
  <div class="og-foot"><span>adxs-hm.github.io/JHDblog</span><span class="f-meta"></span></div>
</div>

<div class="og-card" id="og-site-launch">
  <div class="og-top"></div>
  <div class="og-kicker"></div>
  <div class="og-title"></div>
  <div class="og-desc"></div>
  <div class="og-foot"><span>adxs-hm.github.io/JHDblog</span><span class="f-meta"></span></div>
</div>

<div class="og-card" id="og-default">
  <div class="og-top"></div>
  <div class="og-kicker"></div>
  <div class="og-title"></div>
  <div class="og-desc"></div>
  <div class="og-foot"><span>adxs-hm.github.io/JHDblog</span><span class="f-meta"></span></div>
</div>

</body>
</html>
