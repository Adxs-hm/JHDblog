baseURL = "https://adxs-hm.github.io/JHDblog/"
theme = "PaperMod"
title = "JHD"

hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
mainSections = ["posts"]

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "记录一个网站的建造——这里收录的唯一项目，就是本站自身"
  author = "JHD"
  images = ["og/og-default.png"]
  defaultTheme = "light"
  dateFormat = "2006-01-02"

  # ⚠ TOML 陷阱：以下键必须写在任何 [params.*] 子表【之前】，
  # 否则会落入子表（如 params.assets.ShowReadingTime）而静默失效。
  # 显示开关
  ShowReadingTime = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowShareButtons = true
  ShowPageNums = true
  ShowRelatedPosts = true
  disableSpecial1stPost = false

  # giscus 评论（GitHub Discussions 驱动）— single.html 依 .Param "comments" 渲染
  comments = true

  # Webmention (去 webmention.io 用 GitHub 登录后即生效)
  webmention = "adxs-hm.github.io_jhdblog_"

  [params.assets]
    favicon = "images/planet-avatar.svg"
    favicon16x16 = "images/planet-avatar.svg"
    favicon32x32 = "images/planet-avatar.svg"
    apple_touch_icon = "images/planet-avatar.svg"
    safari_pinned_tab = "images/planet-avatar.svg"
    theme_color = "#f4f3ee"

  [params.giscus]
    repo = "Adxs-hm/JHDblog"
    repoId = "R_kgDOTJEk0w"
    category = "Announcements"
    categoryId = "DIC_kwDOTJEk084DAqTy"

  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Adxs-hm"

  [params.fuseOpts]
    isCaseSensitive = false
    distance = 100
    threshold = 0.25
    minMatchCharLength = 2
    ignoreLocation = true
    keys = ["title", "permalink", "summary", "content"]

  [params.label]
    text = "JHD"

  # 编辑链接（每页 meta 区显示，指向 GitHub 编辑源文件）
  [params.editPost]
    URL = "https://github.com/Adxs-hm/JHDblog/edit/main/content"
    appendFilePath = true
    Text = "编辑此页"

[frontmatter]
  # lastmod 从 git 历史派生（免手工维护），页面 meta 与 og article:modified_time 自动生效
  lastmod = [":git", "lastmod", ":fileModTime"]

[[menu.main]]
  name = "项目"
  url = "posts"
  weight = 1
[[menu.main]]
  name = "构建日志"
  url = "changelog"
  weight = 2
[[menu.main]]
  name = "关于"
  url = "about"
  weight = 3
[[menu.main]]
  name = "搜索"
  url = "search"
  weight = 4
[[menu.main]]
  name = "游戏"
  url = "minesweeper"
  weight = 5

[languages.zh-cn]
  label = "简体中文"
  weight = 1
  [languages.zh-cn.taxonomies]
    category = "categories"
    tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# RSS 全文 — PaperMod 默认输出全文，无需额外配置
