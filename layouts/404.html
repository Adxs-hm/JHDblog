{{- /* 404 · 终端恢复协议（v7 彩蛋页）── */ -}}
{{ define "main" }}
<div class="rec-wrap">
  <div class="rec-head">TERMINAL · SYSTEM RECOVERY PROTOCOL</div>
  <h1 class="rec-title">404 // SIGNAL LOST</h1>
  <div class="rec-sub">你要找的档案不在这个扇区。终端正在尝试修复——或者，玩一盘再说。</div>

  <div class="rec-stage" data-island="rec-game">
    <div class="rec-hud">
      <span>REPAIR <b>0%</b></span>
      <span>INTEGRITY <b>100</b></span>
      <span>T-<b>60s</b></span>
      <span>BEST <b>0%</b></span>
    </div>
    <canvas class="rec-canvas" width="760" height="340" aria-label="终端修复小游戏：接住青色数据包，避开红色损坏包"></canvas>
    <div class="rec-log" role="status" aria-live="polite"></div>
    <div class="rec-actions">
      <button type="button" class="rec-btn" data-act="start">START RECOVERY ></button>
      <a class="rec-btn" href="{{ "" | relURL }}">‹ GO BACK · 返回首页</a>
    </div>
  </div>

  <p class="rec-sub" style="margin-top:1.2rem">提示：鼠标或 ← / → 控制修复光束 · 空格开始 / 重试 · 60 秒内修复度达到 100% 即恢复系统</p>
</div>
{{- end }}
