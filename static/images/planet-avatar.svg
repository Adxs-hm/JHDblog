<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 行星本体：深蓝 → 近黑（浅色纸底上成立，暗底上借金边可见）-->
    <radialGradient id="planetGrad" cx="38%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#3a6ea8"/>
      <stop offset="28%" stop-color="#1e4480"/>
      <stop offset="62%" stop-color="#10254e"/>
      <stop offset="88%" stop-color="#070f28"/>
      <stop offset="100%" stop-color="#040a1c"/>
    </radialGradient>

    <!-- 大气边缘光（亮侧金青辉光）-->
    <radialGradient id="atmoGrad" cx="50%" cy="50" r="50%">
      <stop offset="82%" stop-color="rgba(120,170,230,0)"/>
      <stop offset="92%" stop-color="rgba(150,190,240,.28)"/>
      <stop offset="98%" stop-color="rgba(200,170,110,.45)"/>
      <stop offset="100%" stop-color="rgba(200,170,110,0)"/>
    </radialGradient>

    <!-- 外辉光（金，双背景可见）-->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(190,155,90,0)"/>
      <stop offset="62%" stop-color="rgba(190,155,90,.10)"/>
      <stop offset="88%" stop-color="rgba(190,155,90,.16)"/>
      <stop offset="100%" stop-color="rgba(190,155,90,0)"/>
    </radialGradient>

    <!-- 卫星光晕 -->
    <radialGradient id="satGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(232,208,150,.55)"/>
      <stop offset="100%" stop-color="rgba(232,208,150,0)"/>
    </radialGradient>

    <!-- 行星环：金（两端渐隐 = 景深；中段最亮，压过行星处最醒目）-->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(201,162,90,0)"/>
      <stop offset="18%" stop-color="rgba(201,162,90,.55)"/>
      <stop offset="50%" stop-color="rgba(232,208,150,.9)"/>
      <stop offset="82%" stop-color="rgba(201,162,90,.55)"/>
      <stop offset="100%" stop-color="rgba(201,162,90,0)"/>
    </linearGradient>

    <!-- 经纬线框：金细线 -->
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(201,162,90,.05)"/>
      <stop offset="50%" stop-color="rgba(201,162,90,.5)"/>
      <stop offset="100%" stop-color="rgba(201,162,90,.05)"/>
    </linearGradient>

    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 行星轮廓：环投影只落在行星盘内 -->
    <clipPath id="planetClip">
      <circle cx="100" cy="100" r="54"/>
    </clipPath>

    <!-- 环投影裁剪：行星盘 ∩ 屏幕下半（远侧弧的投影不可见，只留近侧一条影带）-->
    <clipPath id="shadowClip">
      <rect x="0" y="100" width="200" height="100"/>
      <circle cx="100" cy="100" r="54"/>
    </clipPath>

    <!--
      环前层裁剪：屏幕下半（y > 100）。
      几何约束：倾角必须保持在 ±11.3° 以内，环与行星轮廓的四个交叉点
      才会全部位于中线正确的一侧（近弧全在下、远弧全在上），
      中线裁剪因此精确成立——环身在交叉点不被裁切。
    -->
    <clipPath id="ringFrontClip">
      <rect x="0" y="100" width="200" height="100"/>
    </clipPath>

    <!--
      环系统（前后两层共用，动画同源 → 严格对齐）：
      整环连续无断点；倾角 -11.5° ↔ -8.5° 缓慢进动；
      卫星沿环面椭圆轨道运行，由分层自动完成遮挡。
    -->
    <g id="ringSystem">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-11.5;-8.5;-11.5" keyTimes="0;0.5;1" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="15s" repeatCount="indefinite"/>
        <!-- 主环：连续整椭圆（无 dash 断点）-->
        <ellipse cx="0" cy="0" rx="80" ry="17" fill="none" stroke="url(#ringGrad)" stroke-width="5"/>
        <!-- 外沿细环 -->
        <ellipse cx="0" cy="0" rx="90" ry="19" fill="none" stroke="rgba(201,162,90,.4)" stroke-width="1.3"/>
        <!-- 环上卫星 A -->
        <g>
          <circle r="5" fill="url(#satGlow)"/>
          <circle r="2.6" fill="#e8d096"/>
          <animateMotion dur="46s" repeatCount="indefinite"
            path="M 80,0 A 80,17 0 1 1 -80,0 A 80,17 0 1 1 80,0"/>
        </g>
        <!-- 环上卫星 B（错半周）-->
        <g opacity=".85">
          <circle r="3.4" fill="url(#satGlow)"/>
          <circle r="1.7" fill="#c9a25a"/>
          <animateMotion dur="46s" begin="-23s" repeatCount="indefinite"
            path="M 80,0 A 80,17 0 1 1 -80,0 A 80,17 0 1 1 80,0"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- 外辉光（呼吸）-->
  <circle cx="100" cy="100" r="94" fill="url(#glowGrad)">
    <animate attributeName="opacity" values=".75;1;.75" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- 背景星点（金：纸底与 GitHub 暗底均可见）-->
  <g filter="url(#starGlow)" fill="#c9a25a">
    <circle cx="28" cy="38" r="1.4" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="46" r="1" opacity="0">
      <animate attributeName="opacity" values="0;.65;0" dur="5.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="162" r="1.2" opacity="0">
      <animate attributeName="opacity" values="0;.7;0" dur="4.8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="156" r="1.3" opacity="0">
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin=".5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 行星环 · 后层：整环连续绘制，压在行星盘上的远侧弧由行星本体遮挡 -->
  <g transform="translate(100,100)">
    <use xlink:href="#ringSystem" href="#ringSystem"/>
  </g>

  <!-- 行星本体 -->
  <circle cx="100" cy="100" r="54" fill="url(#planetGrad)"/>

  <!-- 表面纹理（低对比云带 + 高地）-->
  <g opacity=".22">
    <ellipse cx="82" cy="82" rx="26" ry="10" fill="#6fa8e8" transform="rotate(-14,82,82)"/>
    <ellipse cx="114" cy="112" rx="20" ry="7" fill="#3a6ea8" transform="rotate(10,114,112)"/>
    <ellipse cx="90" cy="106" rx="12" ry="5" fill="#8fc0f0" transform="rotate(-6,90,106)"/>
    <ellipse cx="106" cy="74" rx="16" ry="6" fill="#4a80b8" transform="rotate(8,106,74)"/>
    <circle cx="74" cy="98" r="2.6" fill="#a8d0f8"/>
    <circle cx="118" cy="88" r="3.2" fill="#a8d0f8"/>
    <circle cx="94" cy="120" r="1.8" fill="#c8e0f8"/>
  </g>

  <!-- 环在行星上的投影（裁剪在行星盘 ∩ 屏幕下半，偏移背光方向）-->
  <g clip-path="url(#shadowClip)">
    <g transform="translate(100,100)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-11.5;-8.5;-11.5" keyTimes="0;0.5;1" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="15s" repeatCount="indefinite"/>
        <ellipse cx="2.5" cy="4" rx="80" ry="17" fill="none" stroke="#061020" stroke-width="7" opacity=".24"/>
      </g>
    </g>
  </g>

  <!-- 经纬线框（线框行星语言：经线椭圆组缓慢旋转）-->
  <g>
    <ellipse cx="100" cy="100" rx="54" ry="16" fill="none" stroke="url(#wireGrad)" stroke-width=".7" opacity=".5"/>
    <ellipse cx="100" cy="100" rx="54" ry="34" fill="none" stroke="url(#wireGrad)" stroke-width=".7" opacity=".38"/>
    <ellipse cx="100" cy="100" rx="54" ry="50" fill="none" stroke="url(#wireGrad)" stroke-width=".7" opacity=".26"/>
    <ellipse cx="100" cy="100" rx="16" ry="54" fill="none" stroke="url(#wireGrad)" stroke-width=".7" opacity=".4"/>
    <ellipse cx="100" cy="100" rx="34" ry="54" fill="none" stroke="url(#wireGrad)" stroke-width=".7" opacity=".3"/>
    <ellipse cx="100" cy="100" rx="50" ry="54" fill="none" stroke="url(#wireGrad)" stroke-width=".7" opacity=".22"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="90s" repeatCount="indefinite"/>
  </g>

  <!-- 大气边缘 -->
  <circle cx="100" cy="100" r="55.5" fill="none" stroke="rgba(150,190,240,.35)" stroke-width="1"/>
  <circle cx="100" cy="100" r="56" fill="url(#atmoGrad)"/>

  <!-- 亮侧高光 -->
  <circle cx="84" cy="82" r="11" fill="rgba(255,255,255,.13)">
    <animate attributeName="opacity" values=".10;.18;.10" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 行星环 · 前层：仅屏幕下半（压过行星的近侧弧），与后层合成一条完整连续的环 -->
  <g clip-path="url(#ringFrontClip)">
    <g transform="translate(100,100)">
      <use xlink:href="#ringSystem" href="#ringSystem"/>
    </g>
  </g>
</svg>
